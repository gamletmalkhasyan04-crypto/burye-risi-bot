name: post-top-players

# Постит в Telegram топ-3 игрока "Бурые Рыси" по итогам конкретного матча.
# Запускается только вручную -- после каждой сыгранной игры укажите ссылку
# на страницу игры (или сразу /protocol) в поле url.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL страницы игры или /protocol на ablforpeople.com'
        required: true
      top:
        description: 'Сколько игроков брать в топ'
        required: false
        default: '3'
      dry_run:
        description: 'Не отправлять в Telegram, только показать пост и разбор в логе'
        required: false
        default: true
        type: boolean

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Run top_players.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python top_players.py "${{ github.event.inputs.url }}" --top "${{ github.event.inputs.top }}"
