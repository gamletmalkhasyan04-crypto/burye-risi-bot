name: post-to-telegram

on:
  schedule:
    # Время в UTC (МСК = UTC+3, без перехода на летнее/зимнее время).
    # Минуты специально НЕ 00 -- GitHub официально предупреждает, что
    # запуски ровно в начале часа чаще задерживаются из-за перегрузки
    # (см. https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule).
    - cron: '1 15 * * 5'  # пятница ~18:01 МСК -> анонс игры(игр) на выходные
    - cron: '1 10 * * 1'  # понедельник ~13:01 МСК -> итоги прошедшей игры (с фото)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим: announce или recap'
        required: true
        default: 'announce'
        type: choice
        options:
          - announce
          - recap
      dry_run:
        description: 'Не отправлять в Telegram, только показать текст в логе'
        required: false
        default: true
        type: boolean

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "1 15 * * 5" ]; then
            echo "mode=announce" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "1 10 * * 1" ]; then
            echo "mode=recap" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ github.event.inputs.mode || 'announce' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Необязательно -- если секрета нет, бот просто использует более
          # простой фиксированный текст поста вместо живого от Claude.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python bot.py --mode ${{ steps.mode.outputs.mode }}

      - name: Upload screenshots (for preview/debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-card-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
